name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download Mobile Manager artifact
        uses: actions/download-artifact@v8
        with:
          path: manager
          name: Manager-release

      - name: Download Wear Manager artifact
        uses: actions/download-artifact@v8
        with:
          path: manager
          name: Wear-Manager-release

      - name: Check is rc tags
        id: is_rc_tag
        run: |
          if [ "${{ contains(github.ref_name,'-rc') }}" == 'true' ]; then
            echo "IS_RC_TAG=true" >> $GITHUB_OUTPUT
          else
            echo "IS_RC_TAG=false" >> $GITHUB_OUTPUT
          fi

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.is_rc_tag.outputs.IS_RC_TAG == 'true' }}
          files: |
            manager/*.apk
